AWSTemplateFormatVersion: '2010-09-09'
Description: >
 Setup an AWS Batch Compute Environment and Job Queue
 with ECS containers not running on HT (SMT disabled at boot, any instance size).
 Experimental: disabling HT is not officially supported by AWS Batch.
 Author: yusongw@

Parameters:
  InstanceTypes:
    Description: EC2 instance types or families
    Type: CommaDelimitedList
    Default: "default_x86_64"
  Minvcpus:
    Type: Number
    Default: 0
    Description: Minimum number of vCPUs per Compute Environment
  Maxvcpus:
    Type: Number
    Default: 256
    Description: Max EC2 vCPUs per CE, counted with HT. On SMT types set 2x the cores you need (256 = 128 cores)
  EBSBootSize:
    Type: Number
    Default: 30
    Description: Size in GiB of EBS root volume
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group Id

############################
## AWS Batch Infrastructure
Resources:
  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BatchInstanceRole

  BatchLaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    Properties:
      LaunchTemplateData:
          BlockDeviceMappings:
          - DeviceName: '/dev/xvda'          # custom AMI: must match its root device
            Ebs:
              DeleteOnTermination: true
              Encrypted: false
              Iops: 3000
              VolumeSize: !Ref EBSBootSize
              VolumeType: 'gp3'
          # Boothook runs on every boot inside cloud-init.service; ecs.service has
          # After=cloud-final.service, so ECS registers CPUs only after SMT is off.
          # Batch then learns the registered CPU count from ECS for scaling.
          # Custom AMI needs: cloud-init, that ecs.service ordering, kernel smt/control.
          # Check result: journalctl -b -t batch-smt-off
          UserData:
            Fn::Base64: |
              MIME-Version: 1.0
              Content-Type: multipart/mixed; boundary="==MYBOUNDARY=="

              --==MYBOUNDARY==
              Content-Type: text/cloud-boothook; charset="us-ascii"

              #cloud-boothook
              #!/bin/bash
              CTL=/sys/devices/system/cpu/smt/control
              log() { logger -s -t batch-smt-off "$*"; }   # journal + cloud-init-output.log

              state=$(cat $CTL 2>/dev/null || echo missing)
              case "$state" in
                on)
                  echo off > $CTL
                  [ "$(cat /sys/devices/system/cpu/smt/active)" = "0" ] \
                    && log "OK: SMT disabled, nproc=$(nproc)" \
                    || log "ERROR: SMT still on, ECS will register all vCPUs" ;;
                off|forceoff|notsupported)
                  log "OK: no SMT to disable (state=$state), nproc=$(nproc)" ;;   # e.g. c7a, c8a
                *)
                  log "ERROR: cannot control SMT (state=$state), ECS will register all vCPUs" ;;
              esac

              --==MYBOUNDARY==--

  BatchECSCE:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ComputeResources:
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        LaunchTemplate:
            LaunchTemplateId: !Ref BatchLaunchTemplate
            Version: $Latest
        MinvCpus: !Ref Minvcpus
        MaxvCpus: !Ref Maxvcpus            # EC2 vCPUs: half are usable when HT is off
        SecurityGroupIds:
          - !Ref SecurityGroupId
        Subnets: !Ref SubnetIds
        Type: EC2
        InstanceRole: !Ref BatchInstanceProfile
        InstanceTypes: !Ref InstanceTypes
      State: ENABLED

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub 'jq-no-hyperthreads-${AWS::StackName}'
      ComputeEnvironmentOrder:
        - ComputeEnvironment: !Ref BatchECSCE
          Order: 1
      Priority: 1
      State: "ENABLED"


#############
## Outputs ##
#############
Outputs:
  ComputeEnvironment:
    Value: !Ref BatchECSCE
  JobQueue:
    Value: !Ref BatchJobQueue
